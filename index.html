<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI-Dub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 50px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #b0b0b0;
            font-size: 18px;
        }

        .upload-box {
            margin-top: 40px;
            padding: 35px;
            border: 2px dashed #3ea2f6;
            border-radius: 18px;
            background: #1f2937;
        }

        input {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            padding: 20px 35px;
            background: #16a34a;
            color: white;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        .upload-btn:hover {
            background: #15803d;
        }

        .file-name {
            margin-top: 25px;
            color: #b0b0b0;
        }

        select {
            margin-top: 25px;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            padding: 15px 35px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin-top: 25px;
            font-size: 17px;
        }

        video {
            max-width: 100%;
            margin-top: 25px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AI-Dub</h1>

        <p>Upload your video and select an AI voice.</p>

        <div class="upload-box">

            <input
                type="file"
                id="videoInput"
                accept="video/*"
            >

            <label
                for="videoInput"
                class="upload-btn"
            >
                Choose Video
            </label>

            <div
                class="file-name"
                id="fileName"
            >
                No video selected
            </div>

            <br>

            <select id="voiceSelect">
                <option value="Myanmar Female Voice">
                    Myanmar Female Voice
                </option>

                <option value="Myanmar Male Voice">
                    Myanmar Male Voice
                </option>
            </select>

            <br>

            <button onclick="uploadVideo()">
                Start AI Dub
            </button>

            <div id="status"></div>

            <video
                id="preview"
                controls
                style="display:none;"
            ></video>

        </div>

    </div>


    <script>

        const videoInput =
            document.getElementById("videoInput");

        const fileName =
            document.getElementById("fileName");

        const preview =
            document.getElementById("preview");


        videoInput.addEventListener(
            "change",
            function () {

                const file =
                    videoInput.files[0];

                if (file) {

                    fileName.textContent =
                        file.name;

                    preview.src =
                        URL.createObjectURL(file);

                    preview.style.display =
                        "block";

                }

            }
        );


        async function uploadVideo() {

            const video =
                videoInput.files[0];

            const voice =
                document.getElementById(
                    "voiceSelect"
                ).value;

            const status =
                document.getElementById(
                    "status"
                );


            if (!video) {

                status.textContent =
                    "Please select a video first.";

                return;

            }


            status.textContent =
                "Uploading video...";


            const formData =
                new FormData();


            formData.append(
                "video",
                video
            );


            formData.append(
                "voice",
                voice
            );


            try {

                const response =
                    await fetch(
                        "https://ai-dub-01.onrender.com/dub",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (data.success) {

                    status.textContent =
                        "Success! " +
                        data.message;

                } else {

                    status.textContent =
                        "Error: " +
                        data.error;

                }

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "Connection error. Please try again.";

            }

        }

    </script>

</body>
</html>
