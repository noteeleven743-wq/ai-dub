<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI-Dub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 50px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #b0b0b0;
      font-size: 18px;
    }

    .upload-box {
      margin-top: 40px;
      padding: 35px 20px;
      border: 2px dashed #3a82f6;
      border-radius: 18px;
      background: #1f2937;
    }

    input {
      display: none;
    }

    .upload-btn {
      display: inline-block;
      padding: 20px 35px;
      background: #16a34a;
      color: white;
      border-radius: 18px;
      font-size: 24px;
      cursor: pointer;
    }

    .upload-btn:hover {
      background: #15803d;
    }

    .file-name {
      margin-top: 25px;
      color: #9cc4ff;
      font-size: 18px;
    }

    video {
      width: 100%;
      margin-top: 30px;
      border-radius: 18px;
      display: none;
      background: black;
    }

    .settings {
      margin-top: 45px;
    }

    select {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      font-size: 22px;
      border-radius: 18px;
      border: none;
      margin-bottom: 25px;
    }

    .dub-btn {
      padding: 20px 30px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 24px;
      cursor: pointer;
    }

    .dub-btn:hover {
      background: #2563eb;
    }

    .dub-btn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .status {
      margin-top: 30px;
      font-size: 20px;
      color: #facc15;
      min-height: 50px;
    }

    .note {
      margin-top: 20px;
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Upload Your Video</h1>

    <p>Choose a video and try Myanmar voice preview</p>

    <div class="upload-box">

      <label for="videoInput" class="upload-btn">
        📁 Choose Video
      </label>

      <input
        type="file"
        id="videoInput"
        accept="video/*"
      >

      <div
        class="file-name"
        id="fileName"
      >
        No video selected
      </div>

      <video
        id="videoPlayer"
        controls
      ></video>

    </div>


    <div class="settings">

      <h2>Dub Settings</h2>

      <select id="voiceSelect">

        <option value="female">
          Myanmar Female Voice
        </option>

        <option value="male">
          Myanmar Male Voice
        </option>

      </select>

      <br>

      <button
        class="dub-btn"
        id="dubButton"
        onclick="startDub()"
      >
        🤖 Start AI Dubbing
      </button>

      <div
        class="status"
        id="status"
      ></div>

      <div class="note">
        Free browser demo mode.<br>
        Real video dubbing will require an AI server/API connection.
      </div>

    </div>

  </div>


  <script>

    const videoInput =
      document.getElementById("videoInput");

    const videoPlayer =
      document.getElementById("videoPlayer");

    const fileName =
      document.getElementById("fileName");

    const status =
      document.getElementById("status");

    const voiceSelect =
      document.getElementById("voiceSelect");

    const dubButton =
      document.getElementById("dubButton");


    videoInput.addEventListener(
      "change",
      function () {

        const file = this.files[0];

        if (!file) {
          return;
        }

        fileName.innerText =
          "Selected: " + file.name;

        const videoURL =
          URL.createObjectURL(file);

        videoPlayer.src =
          videoURL;

        videoPlayer.style.display =
          "block";

        status.innerHTML =
          "✅ Video is ready.";

      }
    );


    async function startDub() {

      const file =
        videoInput.files[0];

      if (!file) {

        status.innerHTML =
          "⚠️ Please choose a video first.";

        return;

      }


      dubButton.disabled =
        true;

      status.innerHTML =
        "⏳ Preparing video...";


      await wait(1000);


      status.innerHTML =
        "🎙️ Preparing Myanmar voice...";


      await wait(1500);


      status.innerHTML =
        "🤖 Starting voice preview...";


      speakMyanmarDemo();


      await wait(1000);


      status.innerHTML =
        "⚠️ Browser preview completed. Real AI dubbing server will be connected next.";

      dubButton.disabled =
        false;

    }


    function speakMyanmarDemo() {

      if (
        !("speechSynthesis" in window)
      ) {

        status.innerHTML =
          "❌ Your browser does not support voice preview.";

        return;

      }


      window.speechSynthesis.cancel();


      const message =
        new SpeechSynthesisUtterance(
          "မင်္ဂလာပါ။ AI Dubbing System ကို စမ်းသပ်နေပါသည်။"
        );


      const selectedVoice =
        voiceSelect.value;


      message.rate =
        0.9;


      message.pitch =
        selectedVoice === "female"
          ? 1.2
          : 0.8;


      const voices =
        window.speechSynthesis.getVoices();


      const myanmarVoice =
        voices.find(
          voice =>
            voice.lang.includes("my")
        );


      if (myanmarVoice) {

        message.voice =
          myanmarVoice;

      }


      window.speechSynthesis.speak(
        message
      );

    }


    function wait(ms) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );

    }

  </script>

</body>
</html>
